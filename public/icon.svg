<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#0369a1" />
      <stop offset="100%" stop-color="#075985" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-opacity="0.25" flood-color="#000" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="112" fill="url(#bg)" />

  <!-- Inner Subtle Border -->
  <rect x="16" y="16" width="480" height="480" rx="96" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="4" />

  <!-- BSC 4 Quadrants Graphic -->
  <g filter="url(#shadow)" transform="translate(64, 64)">
    <!-- Central Shield / Circle Base -->
    <circle cx="192" cy="192" r="140" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.2)" stroke-width="6" />

    <!-- Bar Chart Columns representing BSC Performance -->
    <!-- Bar 1 (Financial) -->
    <rect x="110" y="200" width="34" height="100" rx="8" fill="url(#accent)" />
    <!-- Bar 2 (Customer) -->
    <rect x="156" y="150" width="34" height="150" rx="8" fill="#ffffff" />
    <!-- Bar 3 (Internal Process) -->
    <rect x="202" y="120" width="34" height="180" rx="8" fill="url(#gold)" />
    <!-- Bar 4 (Growth & Learning) -->
    <rect x="248" y="80" width="34" height="220" rx="8" fill="#38bdf8" />

    <!-- Target Bullseye & Trend Indicator -->
    <path d="M100 190 Q 180 130, 275 75" fill="none" stroke="#fcd34d" stroke-width="8" stroke-linecap="round" stroke-dasharray="2 1" />
    <circle cx="275" cy="75" r="12" fill="#fbbf24" stroke="#ffffff" stroke-width="4" />

    <!-- Branch Lettermark / Emblem -->
    <text x="192" y="340" font-family="Inter, -apple-system, sans-serif" font-weight="900" font-size="28" fill="#ffffff" text-anchor="middle" letter-spacing="4">RAITU BSC</text>
  </g>
</svg>
